<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Conquer Academy</title>
    <meta name="description" content="Accede a tu cuenta de Conquer Academy con tu email y contraseña.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Exo+2:wght@400;600&family=Orbitron:wght@600;700&family=Share+Tech+Mono&display=swap">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="cabecera">
        <a class="cabecera__logo" href="../index.html">
            <img src="../img/logo/logo-conquer-500.png"
                 srcset="../img/logo/logo-conquer-500.png 1x, ../img/logo/logo-conquer-800.png 2x"
                 width="250" height="24" alt="Conquer Academy - Ir al inicio">
        </a>
        <nav class="menu" aria-label="Menú principal">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../pages/quienes-somos.html">Quiénes somos</a></li>
                <li><a href="../pages/cursos.html">Cursos</a></li>
                <li><a href="../pages/blog.html">Blog</a></li>
                <li><a href="../pages/registro.html">Registro</a></li>
                <li><a href="../pages/login.html" aria-current="page">Login</a></li>
                <li><a href="../pages/contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Iniciar sesión</h1>

        <form action="#" method="post">
            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </p>
            <p>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </p>
            <button type="submit">Iniciar sesión</button>
        </form>

        <p>¿Aún no tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </main>

    <footer class="pie">
        <p><small>&copy; 2026 Conquer Academy. Todos los derechos reservados.</small></p>
        <p><a href="../pages/aviso-legal.html">Aviso legal</a></p>
    </footer>
</body>
</html>
