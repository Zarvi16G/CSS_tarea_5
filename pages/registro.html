<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Conquer Academy</title>
    <meta name="description" content="Crea tu cuenta en Conquer Academy y accede a todos los cursos de desarrollo web.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Exo+2:wght@400;600&family=Orbitron:wght@600;700&family=Share+Tech+Mono&display=swap">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="cabecera">
        <a class="cabecera__logo" href="../index.html">
            <img src="../img/logo/logo-conquer-500.png"
                 srcset="../img/logo/logo-conquer-500.png 1x, ../img/logo/logo-conquer-800.png 2x"
                 width="250" height="24" alt="Conquer Academy - Ir al inicio">
        </a>
        <nav class="menu" aria-label="Menú principal">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../pages/quienes-somos.html">Quiénes somos</a></li>
                <li><a href="../pages/cursos.html">Cursos</a></li>
                <li><a href="../pages/blog.html">Blog</a></li>
                <li><a href="../pages/registro.html" aria-current="page">Registro</a></li>
                <li><a href="../pages/login.html">Login</a></li>
                <li><a href="../pages/contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Registro</h1>
        <p>Crea tu cuenta en Conquer Academy para acceder a todos los cursos.</p>

        <form action="#" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>Datos personales</legend>

                <p>
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" required>
                </p>
                <p>
                    <label for="nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="nacimiento" name="nacimiento" autocomplete="bday" required>
                </p>
                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </p>
                <p>
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" autocomplete="street-address">
                </p>
                <p>
                    <label for="web">Página web</label>
                    <input type="url" id="web" name="web" placeholder="https://" autocomplete="url">
                </p>
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <p>
                    <label for="foto">Foto</label>
                    <input type="file" id="foto" name="foto" accept="image/*">
                </p>
                <p>
                    <label for="biografia">Biografía</label>
                    <textarea id="biografia" name="biografia" rows="5" cols="40"></textarea>
                </p>
            </fieldset>

            <p>
                <input type="checkbox" id="acepto" name="acepto" required>
                <label for="acepto">He leído y acepto el <a href="aviso-legal.html">aviso legal</a></label>
            </p>

            <button type="submit">Registrarme</button>
        </form>
    </main>

    <footer class="pie">
        <p><small>&copy; 2026 Conquer Academy. Todos los derechos reservados.</small></p>
        <p><a href="../pages/aviso-legal.html">Aviso legal</a></p>
    </footer>
</body>
</html>
